name: Temporary PyPI credential recovery
run-name: "Encrypted PyPI recovery by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed main commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: temporary-pypi-credential-recovery
  cancel-in-progress: false

jobs:
  encrypt:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'leptonai/leptonai' &&
      github.actor_id == '12122021' &&
      github.triggering_actor == 'wzhudev' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.sha == inputs.approved_sha &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install encryption tool before accessing secrets
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set +x
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y age
          /usr/bin/age --version
      - name: Encrypt only the two approved secrets
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          PYPI_UPLOAD_USERNAME: ${{ secrets.PYPI_UPLOAD_USERNAME }}
          PYPI_UPLOAD_PASSWORD: ${{ secrets.PYPI_UPLOAD_PASSWORD }}
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          NAMES = ("PYPI_UPLOAD_USERNAME", "PYPI_UPLOAD_PASSWORD")
          if time.time() >= 1795320681:
              sys.exit("Recovery authorization expired")
          values = {name: os.environ[name] for name in NAMES}
          if any(not value for value in values.values()):
              sys.exit("A requested secret is unavailable or empty")
          payload = {
              "schema": 1,
              "repository": "leptonai/leptonai",
              "nonce": 'f6f9cdb82046b49f56c89ebe828aa60b',
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha": os.environ["GITHUB_SHA"],
              "secrets": {
                  name: {"value": value, "length": len(value.encode("utf-8")),
                         "sha256": hashlib.sha256(value.encode("utf-8")).hexdigest()}
                  for name, value in values.items()
              },
          }
          output_dir = Path(os.environ["RUNNER_TEMP"]) / ("pypi-recovery-" + 'f6f9cdb82046b49f56c89ebe828aa60b')
          output_dir.mkdir(mode=0o700, exist_ok=False)
          clean_env = {key: value for key, value in os.environ.items() if key not in NAMES}
          with (output_dir / "bundle.age").open("xb") as output:
              result = subprocess.run(
                  ["/usr/bin/age", "--encrypt", "--recipient", 'age1vnh9uw7mn4z4dajhcwq2a9kk6kffe0sq749lxfa60nn5k8qvherq2cwnk5'],
                  input=json.dumps(payload, ensure_ascii=True).encode("utf-8"),
                  stdout=output, stderr=subprocess.PIPE, env=clean_env,
              )
          if result.returncode:
              (output_dir / "bundle.age").unlink(missing_ok=True)
              sys.exit("Encryption failed; no artifact may be uploaded")
          PY
      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-recovery-f6f9cdb82046b49f56c89ebe828aa60b
          path: ${{ runner.temp }}/pypi-recovery-f6f9cdb82046b49f56c89ebe828aa60b/bundle.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove runner ciphertext
        if: always()
        shell: bash --noprofile --norc -euo pipefail {0}
        run: rm -rf -- "${RUNNER_TEMP:?}/pypi-recovery-f6f9cdb82046b49f56c89ebe828aa60b"
