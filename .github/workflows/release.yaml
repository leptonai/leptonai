name: Publish to PyPI
run-name: Publish leptonai from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked build tools
        run: uv sync --locked --only-group build
      - name: Test release validation
        run: uv run --no-sync python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build package
        run: |
          uv build --wheel --no-build-isolation --python .venv/bin/python
          uv run --no-sync twine check dist/*.whl
      - name: Check publishing requirements
        run: uv run --no-sync python .github/scripts/check_release.py dist --publish
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: whl-package
          path: dist/*.whl
          if-no-files-found: error

  test-package:
    needs: build-package
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            python_version: "3.10"
          - runner: macos-latest
            python_version: "3.12"
          - runner: ubuntu-latest
            python_version: "3.13"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "${{ matrix.python_version }}"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@v4
        with:
          name: whl-package
          path: dist
      - name: Install wheel and locked dependencies
        run: |
          uv sync --locked --no-install-project
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          uv pip check --python .venv/bin/python
      - name: Check installed package
        run: |
          uv run --no-sync lep version
          uv run --no-sync python -I -c 'import leptonai, sys; from pathlib import Path; location = Path(leptonai.__file__).resolve(); assert location.is_relative_to(Path(sys.prefix).resolve()), location; print(location)'
      - name: Run tests
        run: uv run --no-sync python -I -m pytest -x leptonai

  publish-pypi:
    needs: test-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: whl-package
          path: dist
      - name: Check publishing requirements
        run: uv run --no-project python .github/scripts/check_release.py dist --publish
      - name: Upload package to PyPI
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_UPLOAD_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_UPLOAD_PASSWORD }}
        run: uv publish dist/*.whl
